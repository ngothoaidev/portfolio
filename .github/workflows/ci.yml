name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:export
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:a11y
        env:
          QA_OUTPUT: artifacts/accessibility
      - name: Save accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: artifacts/accessibility/
          if-no-files-found: warn
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Report development dependency advisories (accepted risk in docs)
        continue-on-error: true
        run: npm audit --audit-level=moderate
