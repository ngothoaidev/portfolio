<path d="M128 86 V122" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M128 198 V234" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M128 310 V346" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M128 420 V458" marker-end="url(#arrow)"/></g>
<g fill="#242923" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle"><text x="128" y="44">React / Vite SPA</text><text x="128" y="154">Express API</text><text x="128" y="266">PostgreSQL / Drizzle</text><text x="128" y="378">Separate worker</text><text x="128" y="490">Notifications / email</text></g>
<g fill="#596155" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle"><text x="128" y="66">HTTP commands + SSE</text><text x="128" y="176">State + events</text><text x="128" y="288">Shared durable state</text><text x="128" y="400">Settle / claim / dispatch</text><text x="128" y="512">At-least-once delivery</text></g></svg>