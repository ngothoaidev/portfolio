<svg xmlns="http://www.w3.org/2000/svg" width="256" height="560" viewBox="0 0 256 560" role="img" aria-labelledby="title desc">
<title id="title">Online-Auction implementation architecture</title><desc id="desc">React SPA communicates with Express using HTTP and SSE. Express and a separate worker share PostgreSQL. The worker dispatches committed outbox events to notifications and email.</desc>
